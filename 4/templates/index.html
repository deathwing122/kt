<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое приложение</title>
</head>
<body>
    <h1>Привет, {{name}}</h1>
    <p>Текущее время: <span id="time">Загрузка...</span></p>
    <script>
        fetch('/api/time')
            .then(r => r.json())
            .then(data => document.getElementById("time").innerText = data.time)
    </script>
</body>
</html>
